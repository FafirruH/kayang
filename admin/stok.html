<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stok Sparepart - Admin Sumber Lancar</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/include.js" defer></script>
  <script src="js/datatable.js" defer></script>
  <script src="js/stok.js" defer></script>
</head>
<body data-auth="admin" class="page-dark" data-page="stok">

  <div data-include="header"></div>

  <main>
    <div class="container page-section">

      <div class="page-head">
        <div>
          <h1 class="page-title">Stok Sparepart</h1>
          <p class="page-subtitle">Kelola daftar barang bengkel</p>
        </div>
        <a href="stok-form.html" class="btn btn--primary">
          <img src="assets/icons/plus.svg" alt="" width="16" height="16" />
          <span>Tambah Barang</span>
        </a>
      </div>

      <div class="toolbar" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
        <label class="sr-only" for="stok-search">Cari barang</label>
        <input id="stok-search" class="search-input" type="search" placeholder="Cari barang..." autocomplete="off" />
        <span id="stok-count" style="font-size:.8rem;color:var(--text-muted,#94a3b8)"></span>
      </div>

      <div class="table-card table-card--dark">
        <table class="data-table data-table--stack" id="stok-table">
          <caption class="sr-only">Daftar stok sparepart</caption>
          <thead>
            <tr>
              <th scope="col" data-sort="nama_barang">Nama Barang</th>
              <th scope="col" data-sort="jenis_barang">Kategori</th>
              <th scope="col" data-sort="harga_jual">Harga</th>
              <th scope="col" data-sort="tersedia">Stok</th>
              <th scope="col" class="data-table__actions">Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr class="data-table__empty">
              <td colspan="5">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="stok-pagination" role="navigation" aria-label="Halaman stok"></div>

    </div>
  </main>

  <div data-include="footer"></div>

</body>
</html>
