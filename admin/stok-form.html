<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tambah Barang - Admin Sumber Lancar</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="../js/auth.js" defer></script>
  <script src="../js/include.js" defer></script>
  <script src="js/stok-form.js" defer></script>
</head>
<!-- Satu halaman untuk tambah dan edit barang:
       stok-form.html          -> Tambah barang
       stok-form.html?id=3     -> Edit barang nomor 3 (diatur js/stok-form.js) -->
<body data-auth="admin" data-page="stok">

  <div data-include="header"></div>

  <main>
    <div class="form-page">
      <form class="form-card" id="stok-form" novalidate>
        <h1 class="form-card__title" id="form-title">Tambah Barang</h1>

        <div class="form-field">
          <label class="form-field__label" for="nama">Nama Barang</label>
          <input class="form-input" id="nama" name="nama" type="text" placeholder="Contoh: Oli Mesin Yamalube 1L" autocomplete="off" required />
          <p class="form-field__error" id="nama-error" hidden></p>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="kategori">Kategori</label>
          <input class="form-input" id="kategori" name="kategori" type="text" list="daftar-kategori" placeholder="Contoh: Oli" autocomplete="off" required />
          <!-- Saran kategori, sama dengan filter di katalog client -->
          <datalist id="daftar-kategori">
            <option value="Oli"></option>
            <option value="Rem"></option>
            <option value="Busi"></option>
            <option value="Ban"></option>
            <option value="Aki"></option>
            <option value="Rantai"></option>
          </datalist>
          <p class="form-field__error" id="kategori-error" hidden></p>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="harga">Harga (Rp)</label>
          <input class="form-input" id="harga" name="harga" type="number" min="0" step="1" inputmode="numeric" placeholder="Contoh: 55000" required />
          <p class="form-field__error" id="harga-error" hidden></p>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="stok">Stok</label>
          <input class="form-input" id="stok" name="stok" type="number" min="0" step="1" inputmode="numeric" placeholder="Contoh: 42" required />
          <p class="form-field__error" id="stok-error" hidden></p>
        </div>

        <div class="form-actions">
          <button class="btn btn--primary" type="submit" id="form-submit">Simpan Barang</button>
          <a class="form-actions__cancel" href="stok.html">Batal</a>
        </div>

        <!-- Pesan hasil simpan / peringatan -->
        <p class="form-status" id="form-status" role="status" hidden></p>
      </form>
    </div>
  </main>

  <div data-include="footer"></div>

</body>
</html>
