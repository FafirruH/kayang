<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Sumber Lancar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-register">

  <main class="auth">

    <!-- Panel kiri: merek -->
    <section class="auth__brand">
      <a href="index.html" class="auth-brand" aria-label="Sumber Lancar - Beranda">
        <img src="assets/icons/wrench-orange.svg" alt="" width="24" height="24" />
        <span>Sumber Lancar</span>
      </a>

      <p class="auth-headline">Kelola stok bengkel<br /><span>tanpa ribet.</span></p>

      <div class="auth-stripe" aria-hidden="true"></div>
    </section>

    <!-- Panel kanan: form -->
    <section class="auth__panel">
      <div class="auth-form auth-form--sm">

        <nav class="auth-tabs" aria-label="Masuk atau daftar">
          <a href="login.html" class="auth-tabs__tab">Login</a>
          <a href="register.html" class="auth-tabs__tab" aria-current="page">Register</a>
        </nav>

        <h1 class="auth-title">Daftar Akun</h1>

        <!-- Belum tersambung ke sistem pendaftaran (menyusul) -->
        <form action="#" onsubmit="return false">
          <div class="auth-field">
            <label class="auth-field__label" for="username">Username</label>
            <div class="auth-input">
              <img src="assets/icons/user.svg" alt="" width="16" height="16" />
              <input id="username" name="username" type="text" autocomplete="username" required />
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-field__label" for="password">Password</label>
            <div class="auth-input">
              <img src="assets/icons/lock.svg" alt="" width="16" height="16" />
              <input id="password" name="password" type="password" autocomplete="new-password" required />
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-field__label" for="password2">Ulangi Password</label>
            <div class="auth-input">
              <img src="assets/icons/lock.svg" alt="" width="16" height="16" />
              <input id="password2" name="password2" type="password" autocomplete="new-password" required />
            </div>
          </div>

          <button class="auth-submit" type="submit">Register</button>
        </form>

        <a href="index.html" class="auth-back">← Kembali ke beranda</a>

      </div>
    </section>

  </main>

</body>
</html>
