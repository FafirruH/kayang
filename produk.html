<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Produk - Sumber Lancar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js?v=20261117"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/include.js" defer></script>
  <script src="js/produk.js" defer></script>
</head>
<body data-page="katalog">

  <div data-include="header"></div>

  <main class="pdp">

    <p class="pdp__status" id="pdp-status" role="status">Memuat produk...</p>

    <section class="pdp__grid" id="pdp" hidden>

      <div class="pdp__media">
        <span class="pdp__tag" id="pdp-tag"></span>
        <img id="pdp-image" src="assets/icons/package-gray.svg" alt="" width="96" height="96" />
      </div>

      <div class="pdp__info">
        <p class="pdp__eyebrow"><span class="pdp__dot" aria-hidden="true"></span><span id="pdp-eyebrow"></span></p>
        <h1 class="pdp__name" id="pdp-name"></h1>
        <p class="pdp__summary" id="pdp-summary"></p>

        <div class="pdp__price-box">
          <p class="pdp__price" id="pdp-price"></p>
          <span class="stock" id="pdp-stock"></span>
        </div>

        <ul class="pdp__chips" id="pdp-chips"></ul>

        <div class="pdp__buy">
          <div class="pdp-qty" role="group" aria-label="Jumlah">
            <button type="button" class="pdp-qty__btn" id="pdp-dec" aria-label="Kurangi jumlah">&minus;</button>
            <output class="pdp-qty__value" id="pdp-qty">1</output>
            <button type="button" class="pdp-qty__btn" id="pdp-inc" aria-label="Tambah jumlah">+</button>
          </div>
          <button type="button" class="pdp__add" id="pdp-add">
            <img src="assets/icons/cart-white.svg" alt="" width="18" height="18" />
            <span>Tambah ke keranjang</span>
          </button>
        </div>

        <div class="pdp-tabs">
          <div class="pdp-tabs__list" role="tablist" aria-label="Informasi produk">
            <button type="button" class="pdp-tabs__tab is-active" role="tab" id="tab-desc" aria-selected="true" aria-controls="panel-desc">Deskripsi</button>
            <button type="button" class="pdp-tabs__tab" role="tab" id="tab-spec" aria-selected="false" aria-controls="panel-spec" tabindex="-1">Spesifikasi</button>
          </div>
          <div class="pdp-tabs__panel" id="panel-desc" role="tabpanel" aria-labelledby="tab-desc"></div>
          <div class="pdp-tabs__panel" id="panel-spec" role="tabpanel" aria-labelledby="tab-spec" hidden>
            <dl class="pdp-spec" id="pdp-spec"></dl>
          </div>
        </div>

        <a href="katalog.html" class="pdp__back">&larr; Kembali ke katalog</a>
      </div>

    </section>

  </main>

  <div data-include="footer"></div>

</body>
</html>
