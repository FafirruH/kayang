<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang - Sumber Lancar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js?v=20261117"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/include.js" defer></script>
  <script src="js/keranjang.js" defer></script>
</head>
<body data-page="keranjang" data-auth="client">

  <div data-include="header"></div>

  <main class="cart2">

    <header class="cart2__head">
      <h1 class="cart2__title">Keranjang <span class="text-primary">Anda</span></h1>
      <p class="cart2__count" id="cart-count-label">0 barang</p>
    </header>

    <!-- Tampil saat keranjang kosong -->
    <section class="cart2__empty" id="cart-empty" hidden>
      <img src="assets/icons/package-gray.svg" alt="" width="64" height="64" />
      <p>Keranjang Anda masih kosong.</p>
      <a href="katalog.html" class="btn btn--primary">Lihat Katalog</a>
    </section>

    <!-- Tampil saat ada isi keranjang -->
    <section class="cart2__content" id="cart-wrap" hidden>

      <div class="cart2__items" id="cart-items">
        <!-- Diisi oleh keranjang.js -->
      </div>

      <aside class="cart2__side" aria-label="Voucher dan ringkasan">
        <h2 class="cart2__side-title" id="voucher-title">Voucher</h2>
        <form class="cart2-voucher" onsubmit="return false">
          <input class="cart2-voucher__input" id="voucher-code" type="text" name="voucher" placeholder="Masukkan kode" aria-label="Kode voucher" autocomplete="off" />
          <button class="cart2-voucher__btn" id="voucher-apply" type="button">Tukar</button>
        </form>
        <p class="cart2-voucher__hint" id="voucher-msg" role="status"></p>

        <h2 class="cart2__side-title">Ringkasan</h2>
        <dl class="cart2-sum">
          <div class="cart2-sum__row"><dt>Subtotal</dt><dd id="cart-subtotal">Rp 0</dd></div>
          <div class="cart2-sum__row"><dt>Diskon</dt><dd id="cart-discount">&ndash;</dd></div>
          <div class="cart2-sum__row cart2-sum__row--total"><dt>Total</dt><dd id="cart-total">Rp 0</dd></div>
        </dl>

        <button id="btn-checkout" type="button" class="cart2__checkout"><span>Checkout</span></button>
        <p class="cart2__note">Stok akan ditahan 24 jam setelah pesanan dibuat.</p>
        <p class="cart2__error" id="checkout-error" role="alert" hidden></p>
      </aside>

    </section>

  </main>

  <div data-include="footer"></div>

</body>
</html>
