<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Sparepart - Sumber Lancar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="js/auth.js" defer></script>
  <script src="js/include.js" defer></script>
  <script src="js/katalog.js" defer></script>
</head>
<body data-page="katalog">

  <div data-include="header"></div>

  <main>

    <section class="banner">
      <div class="banner__inner">

        <svg class="banner__title" viewBox="0 0 1116 265" width="1116" height="265" role="img" aria-label="Catalog">
          <text x="0" y="265" textLength="1116" lengthAdjust="spacingAndGlyphs" font-size="380">CATALOG</text>
        </svg>

        <div class="banner__bike" role="img" aria-label="Gambar motor (placeholder)">
          <span>Gambar motor<br />576 × 346</span>
        </div>

      </div>
    </section>

    <section class="catalog">
      <div class="container">

        <form class="search" role="search" onsubmit="return false">
          <img class="search__icon" src="assets/icons/search-gray.svg" alt="" width="20" height="20" />
          <input class="search__input" type="search" name="q" placeholder="Cari &quot;Oli&quot;, &quot;Kampas Rem&quot;, &quot;Busi&quot;..." aria-label="Cari sparepart" />
        </form>

        <div class="filters" role="group" aria-label="Filter kategori">
          <button type="button" class="chip is-active" data-filter="semua">Semua</button>
          <button type="button" class="chip" data-filter="oli">Oli</button>
          <button type="button" class="chip" data-filter="rem">Rem</button>
          <button type="button" class="chip" data-filter="busi">Busi</button>
          <button type="button" class="chip" data-filter="ban">Ban</button>
          <button type="button" class="chip" data-filter="aki">Aki</button>
          <button type="button" class="chip" data-filter="rantai">Rantai</button>
          <button type="button" class="chip" data-filter="filter">Filter</button>
        </div>

        <!-- Diisi secara dinamis oleh js/katalog.js -->
        <div class="product-grid" aria-live="polite" aria-busy="true">
          <p class="catalog-loading">Memuat produk...</p>
        </div>

      </div>
    </section>

  </main>

  <div data-include="footer"></div>

</body>
</html>
