<header class="site-header">
  <div class="container site-header__inner">

    <a href="index.html" class="brand" aria-label="Sumber Lancar - Beranda">
      <span class="brand__icon">
        <img src="assets/icons/wrench.svg" alt="" width="20" height="20" />
      </span>
      <span class="brand__text">
        <span class="brand__name">Sumber Lancar</span>
        <span class="brand__tagline">Sistem Bengkel Online</span>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Buka menu">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>

    <div class="site-nav" id="site-nav">
      <nav class="nav-links" aria-label="Navigasi utama">
        <a href="index.html"    class="nav-link" data-nav="beranda">Beranda</a>
        <a href="katalog.html"  class="nav-link" data-nav="katalog">Katalog</a>
        <a href="panggilan.html" class="nav-link" data-nav="panggilan">Panggil Montir</a>
      </nav>

      <!-- Keranjang + profil. Status akun diatur js/include.js -->
      <div class="header-auth">
        <span class="header-divider" aria-hidden="true"></span>

        <!-- Keranjang butuh login: diarahkan ke halaman login oleh js/include.js -->
        <a href="keranjang.html" class="nav-icon-btn cart-btn" data-nav="keranjang" data-requires-login data-client-only aria-label="Keranjang">
          <img src="assets/icons/cart-white.svg" alt="" width="28" height="28" />
          <span class="cart-badge" data-cart-count hidden>0</span>
        </a>

        <a href="login.html" class="btn-login" data-auth-login>Login</a>

        <div class="profile" data-profile hidden>
          <button type="button" class="nav-icon-btn profile__toggle" data-profile-toggle aria-haspopup="true" aria-expanded="false" aria-controls="profile-panel" aria-label="Profil akun">
            <img src="assets/icons/profile-white.svg" alt="" width="28" height="28" />
            <span class="admin-tag" data-admin-tag hidden>Admin</span>
          </button>

          <div class="profile-panel" id="profile-panel" role="menu" aria-label="Informasi akun" hidden>
            <div class="profile-panel__info">
              <span class="profile-role" data-profile-role>User</span>
              <dl class="profile-fields">
                <div><dt>Nama Lengkap</dt><dd data-profile-name>-</dd></div>
                <div><dt>Username</dt><dd data-profile-username>-</dd></div>
                <div><dt>No. HP</dt><dd data-profile-phone>-</dd></div>
              </dl>
            </div>
            <a href="pengaturan-akun.html" class="profile-panel__item" role="menuitem" data-profile-config>Pengaturan Akun</a>
            <a href="admin/index.html" class="profile-panel__item" role="menuitem" data-profile-switch>Beralih Dashboard</a>
            <button type="button" class="profile-panel__item profile-panel__item--logout" role="menuitem" data-logout>Log Out</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</header>
