<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesanan Dibuat - Sumber Lancar</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js?v=20261117"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/include.js" defer></script>
  <script src="js/pesanan.js" defer></script>
</head>
<body data-page="keranjang" data-auth="client">

  <div data-include="header"></div>

  <main class="order-done">

    <!-- Konfirmasi setelah tombol Checkout di keranjang -->
    <section class="order-card" id="order-card" hidden aria-labelledby="order-title">
      <div class="order-card__stripe" aria-hidden="true"></div>

      <div class="order-card__check">
        <img src="assets/icons/check-green.svg" alt="" width="44" height="44" />
      </div>

      <h1 class="order-card__title" id="order-title">Pesanan <span class="text-primary">Dibuat!</span></h1>

      <div class="order-card__invoice">
        <span class="order-card__invoice-label">No Faktur</span>
        <strong id="order-invoice">-</strong>
      </div>

      <div class="order-card__hold">
        <img src="assets/icons/clock-orange.svg" alt="" width="20" height="20" />
        <p>Stok barang telah ditahan <strong>24 jam</strong>. Hubungi admin untuk konfirmasi pembayaran.</p>
      </div>

      <ul class="order-card__items" id="order-items"></ul>

      <div class="order-card__row order-card__row--total">
        <span>Total</span><span id="order-total">Rp 0</span>
      </div>

      <div class="order-card__actions">
        <a id="order-wa" class="order-card__wa" href="#" target="_blank" rel="noopener">
          <img src="assets/icons/whatsapp-line.svg" alt="" width="20" height="20" />
          <span>Konfirmasi via WhatsApp</span>
        </a>
        <a href="katalog.html" class="order-card__back">Kembali ke Katalog</a>
      </div>
    </section>

    <!-- Dibuka langsung tanpa pesanan baru -->
    <section class="cart2__empty" id="order-none" hidden>
      <img src="assets/icons/package-gray.svg" alt="" width="64" height="64" />
      <p>Belum ada pesanan baru untuk ditampilkan.</p>
      <a href="katalog.html" class="btn btn--primary">Lihat Katalog</a>
    </section>

  </main>

  <div data-include="footer"></div>

</body>
</html>
